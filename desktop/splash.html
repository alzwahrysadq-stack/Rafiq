<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>رفيق المحاسب</title>
<style>
@font-face{font-family:Tajawal;src:url(assets/Tajawal-Regular.woff2) format('woff2')}
@font-face{font-family:Tajawal;src:url(assets/Tajawal-Bold.woff2) format('woff2');font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:default;
  background:radial-gradient(1100px 620px at 50% -12%,#143c63 0%,#0B2239 46%,#071726 100%);
  font-family:Tajawal,'Segoe UI',Tahoma,Arial,sans-serif;color:#fff}
.glow{position:absolute;width:560px;height:560px;left:50%;top:-200px;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(212,160,23,.17),transparent 65%);pointer-events:none}
.frame{position:absolute;inset:10px;border:1px solid rgba(212,160,23,.55);border-radius:6px;pointer-events:none}
.frame:after{content:'';position:absolute;inset:4px;border:1px solid rgba(212,160,23,.16);border-radius:4px}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{width:198px;height:198px;filter:drop-shadow(0 20px 42px rgba(0,0,0,.45));animation:rise .9s ease-out both}
h1{font-size:41px;font-weight:700;letter-spacing:1px;margin-top:16px;animation:rise .9s .14s ease-out both}
.gold-line{width:216px;height:2px;background:linear-gradient(90deg,transparent,#D4A017,transparent);margin:12px 0 8px;animation:rise .9s .24s ease-out both}
.brand{color:#D4A017;font-size:15px;letter-spacing:9px;font-weight:700;direction:ltr;animation:rise .9s .3s ease-out both}
.sub{color:#9db1c6;font-size:15.5px;margin-top:12px;animation:rise .9s .4s ease-out both}
.bar{width:236px;height:3px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:30px;overflow:hidden;animation:rise .9s .5s ease-out both}
.bar i{display:block;height:100%;width:42%;background:linear-gradient(90deg,#D4A017,#f6d47c);border-radius:3px;animation:slide 1.15s ease-in-out infinite}
.foot{position:absolute;bottom:28px;right:36px;left:36px;display:flex;justify-content:space-between;color:#6f8299;font-size:11.5px}
@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
@keyframes slide{0%{margin-left:-48%}100%{margin-left:112%}}
</style>
</head>
