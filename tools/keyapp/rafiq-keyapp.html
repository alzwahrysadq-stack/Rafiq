<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>مفتاح الأكواد — رفيق المحل</title>
<style>
:root{--navy:#0b2545;--gold:#c9962c;--bg:#f2f5f9;--card:#fff;--line:#e3e9f1;--muted:#64748b}
*{box-sizing:border-box;font-family:'Tajawal','Segoe UI',Tahoma,sans-serif}
body{margin:0;background:var(--bg);color:var(--navy)}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 40px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 14px}
.brand img{height:38px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;box-shadow:0 10px 26px rgba(11,37,69,.06);margin-bottom:14px}
h1{font-size:1.15rem;margin:0 0 4px}h2{font-size:.98rem;margin:0 0 10px}
label{display:block;font-weight:700;font-size:.82rem;margin:12px 0 5px}
input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;font-size:.95rem;background:#fff}
input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-size:.95rem;font-weight:800;cursor:pointer;width:100%;margin-top:14px}
.btn.gold{background:var(--gold);color:#241a02}.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
.btn.sm{width:auto;padding:8px 12px;font-size:.8rem;margin:0}
.muted{color:var(--muted);font-size:.78rem;line-height:1.7}
.code-out{direction:ltr;text-align:center;font-size:1.9rem;font-weight:900;letter-spacing:.06em;background:#0b2545;color:#ffd97a;border-radius:14px;padding:16px 8px;margin-top:12px;display:none}
.log{width:100%;border-collapse:collapse;font-size:.76rem;margin-top:8px}
.log th,.log td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:right}
.log th{color:var(--muted);font-weight:700}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.68rem;font-weight:700}
.tag.on{background:#e7f7ec;color:#137a3d}.tag.off{background:#fdecec;color:#b3261e}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="assets/brand/logo_full.png" alt="رفيق المحل" onerror="this.style.display='none'"/><strong>مفتاح الأكواد</strong></div>
  <div class="card">
    <h1>توليد كود تفعيل</h1>
    <p class="muted">أدخل رمز جهاز المشتري (يظهر له في شاشة التفعيل)، وحدّد النوع والمدة، ثم ولّد الكود.</p>
    <label>رمز جهاز المشتري (8 خانات)</label>
    <input id="deviceCode" dir="ltr" placeholder="XXXX-XXXX" maxlength="9" style="text-transform:uppercase;letter-spacing:.08em;font-weight:700"/>
    <label>اسم المشتري (اختياري — للسجل)</label>
    <input id="buyerName" maxlength="60" placeholder="مثال: متجر الأمانة"/>
    <div class="row2">
      <div><label>نوع التفعيل</label>
        <select id="actType"><option value="0">بدون إنترنت</option><option value="1">بالإنترنت</option><option value="2" selected>الاثنان</option></select></div>
      <div><label>المدة</label>
        <select id="actMonths">
          <option value="1">شهر</option><option value="3">3 أشهر</option><option value="6">6 أشهر</option>
          <option value="12" selected>سنة</option><option value="24">سنتان</option><option value="63">مدى الحياة</option>
        </select></div>
    </div>
    <button class="btn gold" id="genBtn" type="button">🔑 ولّد الكود</button>
    <div class="code-out" id="codeOut"></div>
    <div class="row2" id="codeActions" style="display:none">
      <button class="btn ghost sm" id="copyBtn" type="button">📋 نسخ الكود</button>
      <button class="btn ghost sm" id="saveBtn" type="button">💾 حفظ في السجل</button>
    </div>
    <p class="muted" id="genMsg" role="status"></p>
  </div>
  <div class="card">
    <h2>سجل الأكواد</h2>
    <div id="logBox"></div>
  </div>
  <div class="footer">جميع الحقوق محفوظة لمنصة دهفة للتقنية — أداة الموزّع؛ لا تُسلَّم للمشتري إطلاقًا.</div>
</div>
<script>
function _u8concat(a,b){const out=new Uint8Array(a.length+b.length);out.set(a,0);out.set(b,a.length);return out;}
function _rotr(x,n){return (x>>>n)|(x<<(32-n));}
const _K256=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256Bytes(msg){
  const bytes=typeof msg==='string'?new TextEncoder().encode(msg):msg;
  const l=bytes.length,bitLen=l*8;
  const padded=new Uint8Array((((l+9+63)>>6)<<6));padded.set(bytes);padded[l]=0x80;
  const dv=new DataView(padded.buffer);
  dv.setUint32(padded.length-8,Math.floor(bitLen/4294967296));
  dv.setUint32(padded.length-4,bitLen>>>0);
  const h=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const w=new Uint32Array(64);
  for(let i=0;i<padded.length;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){
      const s0=_rotr(w[t-15],7)^_rotr(w[t-15],18)^(w[t-15]>>>3);
      const s1=_rotr(w[t-2],17)^_rotr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
    }
    let a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
    for(let t=0;t<64;t++){
      const S1=_rotr(e,6)^_rotr(e,11)^_rotr(e,25);
      const ch=(e&f)^(~e&g);
      const t1=(hh+S1+ch+_K256[t]+w[t])>>>0;
      const S0=_rotr(a,2)^_rotr(a,13)^_rotr(a,22);
      const maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    h[0]=(h[0]+a)>>>0;h[1]=(h[1]+b)>>>0;h[2]=(h[2]+c)>>>0;h[3]=(h[3]+d)>>>0;
    h[4]=(h[4]+e)>>>0;h[5]=(h[5]+f)>>>0;h[6]=(h[6]+g)>>>0;h[7]=(h[7]+hh)>>>0;
  }
  const out=new Uint8Array(32);const odv=new DataView(out.buffer);
  for(let i=0;i<8;i++)odv.setUint32(i*4,h[i]);
  return out;
}
function hmacSha256(key,msg){
  let k=key instanceof Uint8Array?key:new TextEncoder().encode(String(key));
  if(k.length>64)k=sha256Bytes(k);
  const pad=new Uint8Array(64);pad.set(k);
  const outer=new Uint8Array(64),inner=new Uint8Array(64);
  for(let x=0;x<64;x++){outer[x]=pad[x]^0x5c;inner[x]=pad[x]^0x36;}
  return sha256Bytes(_u8concat(outer,sha256Bytes(_u8concat(inner,msg instanceof Uint8Array?msg:new TextEncoder().encode(String(msg))))));
}
function bytesHex(u8){return Array.from(u8).map(b=>b.toString(16).padStart(2,'0')).join('');}
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32encode(bytes){let bits=0,val=0,out='';for(const b of bytes){val=(val<<8)|b;bits+=8;while(bits>=5){out+=B32[(val>>>(bits-5))&31];bits-=5;}}if(bits>0)out+=B32[(val<<(5-bits))&31];return out;}
function b32decode(str){const s=String(str||'').toUpperCase().replace(/[^A-Z2-7]/g,'');let bits=0,val=0;const out=[];for(const c of s){const idx=B32.indexOf(c);if(idx<0)continue;val=(val<<5)|idx;bits+=5;if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8;}}return new Uint8Array(out);}
function _b64XorDecode(b64,xk){const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw[i]^xk;return out;}
let _launchKeyCache=null;
function launchSecret(){if(!_launchKeyCache)_launchKeyCache=_b64XorDecode('4AIruaYTE1tEPq61oZR6aw==',0x5a);return _launchKeyCache;}
function _eqBytes(a,b){if(!a||!b||a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)d|=a[i]^b[i];return d===0;}

// ---- أكواد التفعيل ----
// صيغة الكود: RFQ-XXXX-XXXX — 5 بايت: [نوع:2بت | أشهر:6بت] + وسم HMAC 4 بايت (مرتبط بجهاز المشتري).
// النوع: 0=بدون إنترنت، 1=بالإنترنت، 2=الاثنان. الأشهر: 1..62، و63=مدى الحياة.
const ACT_TYPES={0:'offline',1:'online',2:'both'};
function deviceCodeFrom(deviceId){
  return b32encode(sha256Bytes('rafiq-launch-device|'+String(deviceId||'')).slice(0,5)); // 8 خانات
}
function _actTag(deviceCode,b0){
  const msg=_u8concat(new TextEncoder().encode('RFQ1|'+b0+'|'),new TextEncoder().encode(String(deviceCode||'').toUpperCase().replace(/[^A-Z2-7]/g,'')));
  return hmacSha256(launchSecret(),msg).slice(0,4);
}
function buildActivationCode(deviceCode,opts){
  const type=Number(opts?.type)||0,months=Number(opts?.months)||0;
  if(!(type>=0&&type<=2))throw Error('نوع التفعيل غير صالح');
  if(!((months>=1&&months<=62)||months===63))throw Error('مدة التفعيل غير صالحة');
  const b0=((type&3)<<6)|(months&63);
  const payload=_u8concat(Uint8Array.from([b0]),_actTag(deviceCode,b0));
  const enc=b32encode(payload);
  return 'RFQ-'+enc.slice(0,4)+'-'+enc.slice(4,8);
}
function parseActivationCode(code){
  const s=String(code||'').trim().toUpperCase().replace(/\s+/g,'');
  const m=/^RFQ-?([A-Z2-7]{4})-?([A-Z2-7]{4})$/.exec(s);
  if(!m)return null;
  const bytes=b32decode(m[1]+m[2]);
  if(bytes.length!==5)return null;
  return bytes;
}
function verifyActivationCode(deviceCode,code){
  const bytes=parseActivationCode(code);
  if(!bytes)return {ok:false,reason:'format'};
  const b0=bytes[0],type=(b0>>6)&3,months=b0&63;
  if(type>2)return {ok:false,reason:'type'};
  if(!((months>=1&&months<=62)||months===63))return {ok:false,reason:'months'};
  if(!_eqBytes(bytes.slice(1),_actTag(deviceCode,b0)))return {ok:false,reason:'code'};
  return {ok:true,type,months,mode:ACT_TYPES[type]};
}
function activationUntil(months,from){
  const base=from?new Date(from):new Date();
  if(months===63)return new Date(base.getTime()+20*365*864e5).toISOString();
  const d=new Date(base.getTime());d.setMonth(d.getMonth()+Number(months||0));return d.toISOString();
}


//__END__
const KEY='rafiq_keyapp_log_v1';
const $=id=>document.getElementById(id);
function loadLog(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch{return [];}}
function saveLog(j){localStorage.setItem(KEY,JSON.stringify(j));}
function pretty(s){s=String(s||'').toUpperCase().replace(/[^A-Z2-7]/g,'');return s.length>4?s.slice(0,4)+'-'+s.slice(4,8):s;}
function renderLog(){
  const rows=loadLog();
  const box=$('logBox');
  if(!rows.length){box.innerHTML='<p class="muted">لا أكواد بعد — أول كود سيظهر هنا.</p>';return;}
  let h='<table class="log"><tr><th>المشتري</th><th>الجهاز</th><th>النوع</th><th>المدة</th><th>الحالة</th><th></th></tr>';
  for(const r of rows){
    const t=r.type===0?'بدون نت':r.type===1?'بالإنترنت':'الاثنان';
    const m=r.months===63?'مدى الحياة':r.months+' شهر';
    h+=`<tr><td>${r.name||'—'}</td><td dir="ltr">${r.device||''}</td><td>${t}</td><td>${m}</td>`+
       `<td><span class="tag ${r.revoked?'off':'on'}">${r.revoked?'مُبطل':'فعّال'}</span></td>`+
       `<td><button class="btn ghost sm" data-toggle="${r.id}" type="button">${r.revoked?'إعادة':'إبطال'}</button></td></tr>`;
  }
  h+='</table><p class="muted">الإبطال هنا دفتر محلي (لتنظيم بيعك) — لا يوقف نسخة بدون إنترنت بعد تفعيلها.</p>';
  box.innerHTML=h;
  for(const b of box.querySelectorAll('[data-toggle]'))b.onclick=()=>{
    const j=loadLog();const r=j.find(x=>x.id===b.dataset.toggle);
    if(r){r.revoked=!r.revoked;saveLog(j);renderLog();}};
}
let lastCode='';
$('genBtn').onclick=()=>{
  try{
    const dc=pretty($('deviceCode').value);
    if(dc.replace('-','').length!==8){$('genMsg').textContent='اكتب رمز الجهاز كاملًا (8 خانات).';return;}
    const type=Number($('actType').value),months=Number($('actMonths').value);
    lastCode=buildActivationCode(dc.replace('-',''),{type,months});
    $('codeOut').textContent=lastCode;
    $('codeOut').style.display='block';
    $('codeActions').style.display='flex';
    $('genMsg').textContent='الكود جاهز — انسخه أو احفظه في السجل.';
  }catch(e){$('genMsg').textContent=String(e.message||e);}
};
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(lastCode);$('genMsg').textContent='نُسخ الكود.';}catch{ $('genMsg').textContent='انسخه يدويًا: '+lastCode;}};
$('saveBtn').onclick=()=>{
  if(!lastCode)return;
  const j=loadLog();
  j.unshift({id:String(Date.now()),device:pretty($('deviceCode').value),name:$('buyerName').value.trim(),
    type:Number($('actType').value),months:Number($('actMonths').value),code:lastCode,at:new Date().toISOString(),revoked:false});
  saveLog(j);renderLog();$('genMsg').textContent='حُفظ في السجل.';
};
renderLog();
</script>
</body>
</html>
